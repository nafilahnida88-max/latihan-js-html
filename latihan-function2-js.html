<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Function 2</title>
</head>
<body>

    <h2>Latihan Function 2</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // 1. Membuat function (Cukup tulis sekali)
        function cekGanjilGenap(angka) {
            if (angka % 2 === 0) {
                console.log("Angka " + angka + " adalah Genap");
            } else {
                console.log("Angka " + angka + " adalah Ganjil");
            }
        }
       
        // Memanggil function
        cekGanjilGenap(7); // Output: Angka 7 adalah Ganjil
        cekGanjilGenap(8); // Output: Angka 8 adalah Genap
    </script>

</body>
</html>
