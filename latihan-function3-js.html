<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Function 3</title>
</head>
<body>

    <h2>Latihan Function 3</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Membuat function (Cukup tulis sekali)
        function balikString(str) {
            return str.split("").reverse().join("");
        }
       
        // Memanggil function dan mencetaknya ke console
        console.log("Balik string 'JavaScript' menjadi: " + balikString("JavaScript"));
    </script>

</body>
</html>
