<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 2 - Perulangan</title>
</head>
<body>

    <h2>Program Perulangan dengan While</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Program perulangan sederhana dengan while
        let i = 3; // 1. Mulai dari angka terbesar (3)
        while (i > 0) { // 2. Jalankan selama i lebih besar dari 0
            console.log("Iterasi ke-" + i);
            i--; // 3. Kurangi nilai i sebesar 1 di setiap iterasi
        }
        console.log("Start!"); // 4. Dicetak "Start!" setelah perulangan selesai
    </script>

</body>
</html>
